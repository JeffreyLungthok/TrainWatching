<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swiss Train Map</title>
  <meta name="description" content="Every Swiss train at its scheduled position, moving along the real OpenStreetMap tracks.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d52b1e'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map of Switzerland with moving trains"></div>

  <aside id="panel" class="panel" aria-label="Controls">
    <header class="panel-head">
      <div class="brand">
        <span class="flag" aria-hidden="true"></span>
        <div>
          <h1>Swiss trains</h1>
          <p class="sub">Timetable · OSM tracks</p>
        </div>
      </div>
      <button id="collapse" class="icon-btn" aria-expanded="true" aria-controls="panel-body" title="Hide controls">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="clock">
      <div id="time" class="time">--:--:--</div>
      <div class="clock-meta">
        <span id="date" class="date">&nbsp;</span>
        <span id="mode" class="pill live"><span class="dot"></span><span id="modeText">Live</span></span>
      </div>
      <div class="running"><strong id="count">0</strong> trains running</div>
    </div>

    <div id="panel-body" class="panel-body">
      <div class="row">
        <div class="seg" role="group" aria-label="Playback speed">
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="10" aria-pressed="false">10×</button>
          <button type="button" data-speed="60" aria-pressed="false">60×</button>
          <button type="button" data-speed="300" aria-pressed="false">300×</button>
        </div>
        <button type="button" id="now" class="btn" title="Jump back to the current time">Now</button>
      </div>

      <label class="slider">
        <span>Trail</span>
        <input id="trail" type="range" min="1" max="20" step="1" value="6">
        <output id="trailOut" for="trail">6 min</output>
      </label>

      <ul id="legend" class="legend" aria-label="Train categories (click to show or hide)"></ul>

      <footer class="panel-foot">
        <span id="feed" class="feed"></span>
        <button type="button" id="theme" class="icon-btn" title="Switch light / dark map" aria-label="Switch light or dark map">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
        </button>
      </footer>
    </div>
  </aside>

  <div class="attrib">
    Timetable <a href="https://opentransportdata.swiss" target="_blank" rel="noopener">opentransportdata.swiss</a> ·
    Tracks © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ·
    Boundaries © swisstopo
  </div>

  <div id="tip" class="train-tip" role="tooltip" hidden></div>

  <div id="loading" class="loading" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loadMsg">Loading timetable…</p>
  </div>

  <script src="vendor/deck.gl-9.4.0.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
