<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swiss Train Map</title>
  <meta name="description" content="Every Swiss train at its scheduled position, moving along the real OpenStreetMap tracks.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' transform='rotate(45 16 16)' fill='%23f7a600' stroke='%237a7a76' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preload" href="alpine-earth/fonts/SourceSans3-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="alpine-earth/fonts/SourceSerif4-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="alpine-earth/tokens.css">
  <link rel="stylesheet" href="alpine-earth/alpine-earth.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map of Switzerland with moving trains"></div>

  <aside id="panel" class="panel ae-surface ae-surface--paper" aria-label="Controls">
    <header class="panel-head ae-nav">
      <div class="brand">
        <span class="ae-icon ae-icon--route" aria-hidden="true"></span>
        <div>
          <h1>Swiss trains</h1>
          <p class="sub">Timetable · OSM tracks</p>
        </div>
      </div>
      <button id="collapse" class="ae-btn ae-btn--secondary icon-btn" type="button" aria-expanded="true" aria-controls="panel-body" title="Hide controls" aria-label="Hide controls">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="clock">
      <div id="time" class="time ae-letterpress ae-num">--:--:--</div>
      <div class="clock-meta">
        <span id="date" class="date">&nbsp;</span>
        <span id="mode" class="ae-tag status live"><span class="marker" aria-hidden="true"></span><span id="modeText">Live</span></span>
      </div>
      <div class="running"><strong id="count" class="ae-num">0</strong> trains running in Switzerland</div>
    </div>

    <div id="panel-body" class="panel-body">
      <div class="row">
        <div class="seg" role="group" aria-label="Playback speed">
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="10" aria-pressed="false">10×</button>
          <button type="button" data-speed="60" aria-pressed="false">60×</button>
          <button type="button" data-speed="300" aria-pressed="false">300×</button>
        </div>
        <button type="button" id="now" class="ae-btn ae-btn--secondary now" title="Jump back to the current time">Now</button>
      </div>

      <label class="slider">
        <span class="label">Trail</span>
        <input id="trail" type="range" min="1" max="20" step="1" value="6">
        <output id="trailOut" for="trail" class="ae-num">6 min</output>
      </label>

      <ul id="legend" class="legend" aria-label="Train categories (click to show or hide)"></ul>

      <footer class="panel-foot">
        <span id="feed" class="feed"></span>
        <button type="button" id="theme" class="ae-btn ae-btn--secondary icon-btn" title="Switch Paper / Night map" aria-label="Switch between light and dark map">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </footer>
    </div>
  </aside>

  <div class="attrib ae-plate">
    Timetable <a href="https://opentransportdata.swiss" target="_blank" rel="noopener">opentransportdata.swiss</a> ·
    Tracks © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ·
    Boundaries © swisstopo
  </div>

  <div id="tip" class="train-tip ae-plate" role="tooltip" hidden></div>

  <div id="loading" class="loading" role="status">
    <div class="loading-field ae-pattern ae-pattern--contour ae-pattern--standard" aria-hidden="true"></div>
    <div class="loading-plate ae-plate">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadMsg">Loading timetable…</p>
    </div>
    <div class="ae-horizon loading-horizon" aria-hidden="true"></div>
  </div>

  <script src="vendor/deck.gl-9.4.0.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
